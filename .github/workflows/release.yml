name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set download URL for this tag
        run: |
          python3 - "$GITHUB_REF_NAME" << 'EOF'
          import json, sys
          tag = sys.argv[1]
          with open("module.json") as f:
              m = json.load(f)
          m["version"] = tag.lstrip("v")
          m["download"] = f"https://github.com/${{ github.repository }}/releases/download/{tag}/pearl-upgrades.zip"
          with open("module.json", "w") as f:
              json.dump(m, f, indent=2)
          EOF

      - name: Build zip
        run: zip -r pearl-upgrades.zip . -x ".git/*" -x ".github/*" -x "pearl-upgrades.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pearl-upgrades.zip
            module.json
          generate_release_notes: true
